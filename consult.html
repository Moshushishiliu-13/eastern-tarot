<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔罗咨询一对一 - 神秘塔罗</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/consult.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">神秘塔罗</a>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="draw.html">单牌抽取</a></li>
                    <li><a href="spread.html">牌阵解读</a></li>
                    <li><a href="consult.html" class="active">咨询一对一</a></li>
                    <li><a href="about.html">关于我们</a></li>
                </ul>
            </nav>
            <div class="mobile-menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <main class="consult-main">
        <header class="consult-header">
            <h1 class="consult-title">塔罗咨询一对一</h1>
            <p class="consult-lead">选择咨询师，点击二维码进入放大扫码页，使用微信扫描添加好友（全程本地页面，不经过外站链接）。</p>
        </header>

        <div class="consult-grid">
            <article class="consult-card">
                <h2>咨询师 · 梦瑄</h2>
                <p class="hint">扫码添加微信，预约一对一解读</p>
                <a href="consult-scan-1.html" class="consult-qr-link">
                    <span class="tap">点击放大扫码</span>
                    <div class="consult-qr-wrap">
                        <img src="images/consult/mengxuan.jpg" alt="梦瑄的微信二维码" width="240" height="240"
                             onerror="this.onerror=null;this.src='images/consult/mengxuan.svg';">
                    </div>
                </a>
            </article>
            <article class="consult-card">
                <h2>咨询师 · 艾艾</h2>
                <p class="hint">扫码添加微信，预约一对一解读</p>
                <a href="consult-scan-2.html" class="consult-qr-link">
                    <span class="tap">点击放大扫码</span>
                    <div class="consult-qr-wrap">
                        <img src="images/consult/aiai.jpg" alt="艾艾的微信二维码" width="240" height="240"
                             onerror="this.onerror=null;this.src='images/consult/aiai.svg';">
                    </div>
                </a>
            </article>
        </div>

        <p class="consult-note">可将微信导出的二维码保存为本目录下 <strong>images/consult/mengxuan.jpg</strong> 与 <strong>aiai.jpg</strong>（覆盖或新增），页面会自动显示真实二维码。</p>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p><a href="index.html">返回首页</a></p>
            </div>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
